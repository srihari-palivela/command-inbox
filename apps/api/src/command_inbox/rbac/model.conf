# RBAC with domains (tenants) and explicit deny.
# Subject = the user's single role in the tenant (staff | lead | admin); domain = tenant id or "*" for the
# product-wide baseline; object.action = a capability such as ticket.work.
[request_definition]
r = sub, dom, obj, act

[policy_definition]
p = sub, dom, obj, act, eft

[role_definition]
g = _, _, _

[policy_effect]
e = some(where (p.eft == allow)) && !some(where (p.eft == deny))

[matchers]
m = g(r.sub, p.sub, r.dom) && (p.dom == r.dom || p.dom == "*") && r.obj == p.obj && r.act == p.act
