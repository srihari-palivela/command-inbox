[project]
name = "command-inbox-api"
version = "0.1.0"
description = "Command Inbox API and worker: AI triage for bank customer mail"
authors = [
    { name = "Claude", email = "noreply@anthropic.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.8.0",
    "asyncpg>=0.31.0",
    "authlib>=1.8.0",
    "casbin>=1.43.0",
    "cryptography>=50.0.1",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "langfuse>=4.15.6",
    "langgraph>=1.2.12",
    "opentelemetry-api>=1.45.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-instrumentation-fastapi>=0.66b0",
    "opentelemetry-instrumentation-httpx>=0.66b0",
    "opentelemetry-instrumentation-logging>=0.66b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b0",
    "opentelemetry-sdk>=1.45.0",
    "orjson>=3.12.0",
    "prometheus-client>=0.26.0",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
    "joserfc>=1.7.5",
]

[project.scripts]
command-inbox-api = "command_inbox.main:run"
command-inbox-worker = "command_inbox.worker:run"
command-inbox-evals = "command_inbox.evals.cli:main"
command-inbox-migrate = "command_inbox.migrate:main"
command-inbox-seed = "command_inbox.seed.cli:main"
command-inbox-operator = "command_inbox.platform.cli:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "command_inbox"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "psycopg[binary]>=3.3.6",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
    "sqlacodegen>=4.0.4",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM"]
ignore = ["S101", "E501", "RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"src/command_inbox/db/seed/**" = ["S311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: needs a Postgres test database"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
