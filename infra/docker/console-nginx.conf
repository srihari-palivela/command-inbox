# The platform console on its own origin. Only the platform API is proxied: tenant routes are not reachable
# from this origin at all, and the operator cookie never meets the bank-facing app.
limit_req_zone $binary_remote_addr zone=console_signin:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=console_api:10m rate=20r/s;
limit_req_status 429;

server {
  listen 8082;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  set $csp "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'";

  location ^~ /v1/platform/auth/ {
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/proxy.conf;
    limit_req zone=console_signin burst=10 nodelay;
  }

  location ^~ /v1/platform/ {
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/proxy.conf;
    limit_req zone=console_api burst=40 nodelay;
    client_max_body_size 256k;
  }

  location /v1/ {
    return 404;
  }

  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Content-Security-Policy $csp always;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
