# The SPA and the API behind one origin. nginx is the edge here: it overwrites X-Forwarded-For with the
# peer address (clients cannot spoof it) and the API trusts forwarded headers only from this proxy.
limit_req_zone $binary_remote_addr zone=signin:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=expensive:10m rate=30r/m;
limit_req_status 429;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # nginx drops server-level add_header lines in any location that sets its own, so every location
  # includes the full set from one place.
  set $csp "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'";

  location = /v1/stream {
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/proxy.conf;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # The platform API is served only from the console's own origin (console-nginx.conf).
  location ^~ /v1/platform/ {
    return 404;
  }

  location ^~ /v1/auth/ {
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/proxy.conf;
    limit_req zone=signin burst=10 nodelay;
  }

  location ~ ^/v1/(copilot|search|intake)/ {
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/proxy.conf;
    limit_req zone=expensive burst=20 nodelay;
    client_max_body_size 2m;
  }

  location /v1/ {
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/proxy.conf;
    limit_req zone=api burst=60 nodelay;
    client_max_body_size 1m;
  }

  # Hashed assets are immutable; the HTML shell never is.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Content-Security-Policy $csp always;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
