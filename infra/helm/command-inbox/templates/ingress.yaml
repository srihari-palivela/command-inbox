{{- if .Values.ingress.enabled }}
{{- $name := include "ci.name" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels: {{- include "ci.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - secretName: {{ .Values.ingress.tls.secretName }}
      hosts:
        - {{ .Values.ingress.hosts.web }}
        {{- if .Values.hooks.enabled }}
        - {{ .Values.ingress.hosts.hooks }}
        {{- end }}
        {{- if .Values.console.enabled }}
        - {{ .Values.ingress.hosts.console }}
        {{- end }}
  rules:
    - host: {{ .Values.ingress.hosts.web }}
      http:
        paths:
          - path: /v1/platform
            pathType: Prefix
            backend: {service: {name: {{ $name }}-api, port: {number: 80}}}
          - path: /v1
            pathType: Prefix
            backend: {service: {name: {{ $name }}-api, port: {number: 80}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: {{ $name }}-web, port: {number: 80}}}
    {{- if .Values.hooks.enabled }}
    # Provider webhooks only, on their own host and pods (separate SLO and WAF rules).
    - host: {{ .Values.ingress.hosts.hooks }}
      http:
        paths:
          - path: /v1/hooks
            pathType: Prefix
            backend: {service: {name: {{ $name }}-hooks, port: {number: 80}}}
    {{- end }}
    {{- if .Values.console.enabled }}
    - host: {{ .Values.ingress.hosts.console }}
      http:
        paths:
          - path: /v1/platform
            pathType: Prefix
            backend: {service: {name: {{ $name }}-api, port: {number: 80}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: {{ $name }}-console, port: {number: 80}}}
    {{- end }}
{{- end }}
