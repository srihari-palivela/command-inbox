# Scrapes the API and worker /metrics and evaluates the SLO rules. Alerts go to Alertmanager, which routes
# them to the on-call tool (PagerDuty/Opsgenie receivers are configured per installation in alertmanager.yml).
global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/rules.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: command-inbox-api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:4000']
  - job_name: command-inbox-worker
    metrics_path: /metrics
    static_configs:
      - targets: ['worker:4001']
